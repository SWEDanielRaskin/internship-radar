name: Poll job feeds

on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "poller/**"
      - ".github/workflows/poll.yml"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll company job boards
        run: python poller/poll.py

      - name: Commit results
        run: |
          git config user.name "internship-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Poll $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
